name: Smoke

on:
  push:
    branches: [main]
  schedule:
    # Nightly smoke run against production
    - cron: "30 15 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Production smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for this commit's production deployment
        # The suite runs against the LIVE site, but this workflow starts the
        # moment main is pushed, well before Vercel has finished building. It
        # was therefore testing the PREVIOUS deployment: a commit that broke
        # production passed, and the commit that fixed it failed. Block until
        # the deployment for THIS sha reports success.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" -q .state)
            echo "attempt $i: $state"
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ]; then
              echo "The deployment for this commit failed; skipping smoke tests."
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for the deployment of this commit."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rooted-ems/e2e exec playwright install --with-deps chromium

      - name: Run smoke suite
        run: pnpm --filter @rooted-ems/e2e run smoke
