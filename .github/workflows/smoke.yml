name: Smoke

on:
  push:
    branches: [main]
  schedule:
    # Nightly smoke run against production
    - cron: "30 15 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Production smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rooted-ems/e2e exec playwright install --with-deps chromium

      - name: Run smoke suite
        run: pnpm --filter @rooted-ems/e2e run smoke
